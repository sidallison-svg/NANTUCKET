[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nantucket"
version = "0.1.0"
description = "Personal investment screener, portfolio tracker, and market learning tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.40",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
nantucket = "nantucket.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"nantucket.dashboard" = ["templates/*.html", "static/*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]
